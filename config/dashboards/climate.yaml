views:
  - title: Climate
    path: climate
    icon: mdi:thermometer
    cards:
      - type: entities
        title: Living Room
        show_header_toggle: false
        entities:
          - entity: sensor.living_room_climate_sensor_temperature
            name: Temperature
          - entity: sensor.living_room_climate_sensor_humidity
            name: Humidity
          - entity: sensor.living_room_climate_sensor_battery
            name: Battery
      - type: gauge
        entity: sensor.living_room_climate_sensor_humidity
        name: Humidity
        min: 0
        max: 100
        needle: true
        severity:
          green: 30
          yellow: 60
          red: 75
      - type: history-graph
        title: Temperature and humidity history
        hours_to_show: 24
        entities:
          - entity: sensor.living_room_climate_sensor_temperature
            name: Temperature
          - entity: sensor.living_room_climate_sensor_humidity
            name: Humidity
