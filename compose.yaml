name: home-sweet-home-home-assistant

services:
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Lisbon}
    volumes:
      - ${HASS_CONFIG_DIR:-./config}:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '${HASS_PORT:-8123}:8123'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8123/manifest.json']
      interval: 30s
      timeout: 10s
      retries: 3
